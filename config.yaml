# InstaReaper Configuration File

# Application Settings
app:
  name: "InstaReaper"
  version: "1.0.0"
  debug: false

# Reddit Scraping Settings
reddit:
  user_agent: "InstaReaper/1.0"
  rate_limit: 1.0  # Seconds between requests
  max_video_duration: 60  # Maximum video duration in seconds
  subreddits:
    - "funny"
    - "unexpected" 
    - "PublicFreakout"
    - "nextfuckinglevel"
    - "gifs"
    - "videos"
    - "memes"
    - "dankmemes"
  max_videos_per_scrape: 10

# Video Processing Settings
video:
  max_file_size_mb: 100
  supported_formats: [".mp4", ".webm", ".mov", ".avi", ".gif"]
  thumbnail_size: [150, 150]
  
# Database Settings
database:
  path: "data/db.sqlite"
  backup_interval: 24  # hours

# File Paths
paths:
  videos: "data/videos"
  thumbnails: "data/thumbnails"
  logs: "data/logs"
  database: "data/db.sqlite"

# Instagram Settings (basic - detailed config in config/credentials.json)
instagram:
  max_caption_length: 2000
  default_hashtags: ["#viral", "#content", "#reddit", "#instareaper"]

# GUI Settings
gui:
  theme: "dark"
  window_size: [1400, 900]
  grid_columns: 3 
